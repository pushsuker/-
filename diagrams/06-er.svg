ชื่อม 1:N ในไฟล์ .drawio</text><text text-anchor="start" x="1226" y="1352.5" font-size="16" fill="#173550">SVG แสดงรายการ FK ด้านล่างเพื่ออ่านไม่ทับกัน</text><text text-anchor="start" x="1226" y="1375.5" font-size="16" fill="#173550">score: NULL=ยังไม่กรอก, 0=ไม่มี</text><text text-anchor="start" x="1226" y="1398.5" font-size="16" fill="#173550">ไม่มี cascading delete ประวัติการประเมิน</text></g></svg>