<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52728e"/></marker></defs><g font-family="Tahoma, sans-serif"><rect width="1120" height="1120" fill="#f5f7fb"/><text x="40" y="48" font-size="26" font-weight="700" fill="#123455">กรรมการ</text><rect x="40" y="90" width="610" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="56" y="140.5" font-size="16" fill="#173550">Login → รายการมอบหมายของตน</text><polygon points="345.0,208 650,251.0 345.0,294 40,251.0" fill="#dff3ed" stroke="#7892ae"/><text text-anchor="middle" x="345.0" y="258.5" font-size="16" fill="#173550">ตรวจ owner / รอบเปิด / ผู้รับส่งแล้ว?</text><rect x="40" y="326" width="610" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="56" y="376.5" font-size="16" fill="#173550">อ่านรายละเอียด คะแนนตนเอง และหลักฐาน</text><rect x="40" y="444" width="610" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="56" y="494.5" font-size="16" fill="#173550">ให้คะแนนรายข้อ → บันทึกตาม assignment</text><rect x="40" y="562" width="610" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="56" y="612.5" font-size="16" fill="#173550">ตรวจตารางสรุป → ความเห็น → แนบลายเซ็น</text><polygon points="345.0,680 650,723.0 345.0,766 40,723.0" fill="#dff3ed" stroke="#7892ae"/><text text-anchor="middle" x="345.0" y="730.5" font-size="16" fill="#173550">คะแนนครบและมีความเห็น/ลายเซ็น?</text><rect x="40" y="798" width="610" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="56" y="848.5" font-size="16" fill="#173550">ยืนยันส่ง → transaction ล็อกงานตน</text><rect x="40" y="916" width="610" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="56" y="966.5" font-size="16" fill="#173550">กรรมการคนอื่นทำงานต่อได้ → รายงาน</text><polyline points="345.0,176 345.0,192.0 345.0,192.0 345.0,208" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="187.0" font-size="13" fill="#275775"></text><polyline points="345.0,294 345.0,310.0 345.0,310.0 345.0,326" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="305.0" font-size="13" fill="#275775">ผ่าน/ใช่</text><polyline points="345.0,412 345.0,428.0 345.0,428.0 345.0,444" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="423.0" font-size="13" fill="#275775"></text><polyline points="345.0,530 345.0,546.0 345.0,546.0 345.0,562" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="541.0" font-size="13" fill="#275775"></text><polyline points="345.0,648 345.0,664.0 345.0,664.0 345.0,680" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="659.0" font-size="13" fill="#275775"></text><polyline points="345.0,766 345.0,782.0 345.0,782.0 345.0,798" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="777.0" font-size="13" fill="#275775">ผ่าน/ใช่</text><polyline points="345.0,884 345.0,900.0 345.0,900.0 345.0,916" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="353.0" y="895.0" font-size="13" fill="#275775"></text><rect x="740" y="208" width="335" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="756" y="258.5" font-size="16" fill="#173550">ไม่มีสิทธิ์ / นอกเวลา / รอผู้รับ</text><polyline points="650,251.0 695.0,251.0 695.0,251.0 740,251.0" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="701.0" y="242.0" font-size="13" fill="#275775">ไม่ผ่าน</text><rect x="740" y="680" width="335" height="86" rx="10" fill="#ffffff" stroke="#7892ae"/><text text-anchor="start" x="756" y="730.5" font-size="16" fill="#173550">ข้อมูลไม่ครบ → กลับเพิ่มให้ครบ</text><polyline points="650,723.0 695.0,723.0 695.0,723.0 740,723.0" fill="none" stroke="#52728e" stroke-width="2" marker-end="url(#arrow)"/><text x="701.0" y="714.0" font-size="13" fill="#275775">ไม่ครบ</text></g></svg>